name: Rainmaker Staggered Agency Engine

on:
  schedule:
    - cron: '30 13 * * 1,4' # Mon, Thu 9:30 AM EST
    - cron: '30 14 * * 2'   # Tue 10:30 AM EST
    - cron: '30 15 * * 3'   # Wed 11:30 AM EST
  workflow_dispatch:
    inputs:
      target_campaign:
        description: 'Select manual campaign bypass handle'
        required: true
        default: 'rainmaker'
        type: choice
        options:
          - rainmaker
          - televoi
          - roofing

jobs:
  run-allocated-campaign:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Cloud Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Cloud Browser & Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        pip install beautifulsoup4 requests selenium==4.20.0 urllib3<2.0

    - name: 🤖 RUN DAY 1 & 4 - Rainmaker Core Outbound
      if: |
        github.event.schedule == '30 13 * * 1,4' ||
        (github.event_name == 'workflow_dispatch' && inputs.target_campaign == 'rainmaker')
      run: |
        python run_rainmaker_hunt.py
        # FIXED: Automatically push scraper output to Supabase without manual file loads
        python push_to_supabase.py
        python agent_workflow.py

    - name: 📞 RUN DAY 2 - Televoi Local VoIP Sync
      if: |
        github.event.schedule == '30 14 * * 2' ||
        (github.event_name == 'workflow_dispatch' && inputs.target_campaign == 'televoi')
      run: |
        python run_televoi_hunt.py
        python push_to_supabase.py
        python run_televoi_emails.py

    - name: 🏠 RUN DAY 3 - Ohio Storm Roofing Campaign
      if: |
        github.event.schedule == '30 15 * * 3' ||
        (github.event_name == 'workflow_dispatch' && inputs.target_campaign == 'roofing')
      run: |
        python run_roofing_hunt.py
        python push_to_supabase.py
        python run_roofing_emails.py
