        python-version: "3.11"

    - name: Run Radius Data Harvest Loop
      env:
        SUPABASE_URL: "https://supabase.co"
        SUPABASE_KEY: "sb_publishable_CJ3gu19QTicTZq_W2M2inA_UglF98EL"
      run: |
        python3 ./autonomous_sos_harvester.py
