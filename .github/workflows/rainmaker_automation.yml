name: Rainmaker 24/7 Autonomous Core

on:
  schedule:
    - cron: '30 13 * * 1,4' # Mon, Thu 9:30 AM EST
    - cron: '30 14 * * 2'   # Tue 10:30 AM EST
    - cron: '30 15 * * 3'   # Wed 11:30 AM EST
  workflow_dispatch:

jobs:
  autonomous-agency-loop:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Environment Runtimes
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Provision Headless Scraping Infrastructure
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        pip install beautifulsoup4 requests selenium==4.20.0 urllib3<2.0

    - name: 🤖 AUTOMATED WORKER RUN - MONDAYS & THURSDAYS (Rainmaker Core)
      if: |
        github.event.schedule == '30 13 * * 1,4' ||
        github.event_name == 'workflow_dispatch'
      run: |
        echo "Executing Phase 1: Autonomous Data Axle Library Extraction..."
        python autonomous_harvester.py
        
        echo "Executing Phase 2: Running Target Verification Sweeps..."
        python run_rainmaker_hunt.py
        
        echo "Executing Phase 3: Commencing First-Touch Outbound Messaging..."
        python run_rainmaker_emails.py
        
        echo "Executing Phase 4: Running 3-Day Follow-Up Cadences & Unsubscribe Filters..."
        python agent_followup.py
