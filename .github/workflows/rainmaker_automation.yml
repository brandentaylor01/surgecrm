name: Rainmaker 24/7 Cloud Worker

on:
  schedule:
    - cron: '30 13 * * 1,4' # Mondays & Thursdays 9:30 AM EST
    - cron: '30 14 * * 2'   # Tuesdays 10:30 AM EST
    - cron: '30 15 * * 3'   # Wednesdays 11:30 AM EST
  workflow_dispatch:
    inputs:
      target_campaign:
        description: 'Bypass handle for manual execution'
        required: true
        default: 'rainmaker'
        type: choice
        options: [rainmaker, televoi, roofing]

jobs:
  autonomous-execution:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Initialize Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Provision Scraping Assets
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        pip install beautifulsoup4 requests selenium==4.20.0 urllib3<2.0

    - name: Run Rainmaker Vector Pass
      if: |
        github.event.schedule == '30 13 * * 1,4' ||
        (github.event_name == 'workflow_dispatch' && inputs.target_campaign == 'rainmaker')
      run: |
        python run_rainmaker_hunt.py
        python push_to_supabase.py
        python agent_workflow.py

    - name: Run Televoi Vector Pass
      if: |
        github.event.schedule == '30 14 * * 2' ||
        (github.event_name == 'workflow_dispatch' && inputs.target_campaign == 'televoi')
      run: |
        python run_televoi_hunt.py
        python push_to_supabase.py
        python run_televoi_emails.py

    - name: Run Roofing Vector Pass
      if: |
        github.event.schedule == '30 15 * * 3' ||
        (github.event_name == 'workflow_dispatch' && inputs.target_campaign == 'roofing')
      run: |
        python run_roofing_hunt.py
        python push_to_supabase.py
        python run_roofing_emails.py
