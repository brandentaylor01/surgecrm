name: Rainmaker 24/7 Autonomous Core

on:
  schedule:
    - cron: '*/15 * * * *' # Fallback trigger to wake up every 15 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [loop_trigger] # Custom event to catch autonomous self-calls

jobs:
  autonomous-agency-loop:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Environment Runtimes
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Provision Headless Scraping Infrastructure
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        pip install beautifulsoup4 requests selenium==4.20.0 urllib3<2.0

    - name: 🤖 RUN AUTONOMOUS HARVESTER PIPELINE
      run: |
        python autonomous_harvester.py
        python run_rainmaker_hunt.py
        python run_rainmaker_emails.py
        python agent_followup.py

    - name: 🔄 Trigger Next Continuous Loop Sequence
      if: always() # Ensures the loop restarts even if a step encounters a lead error
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://github.com{{ github.repository }}/dispatches \
          -d '{"event_type": "loop_trigger"}'
