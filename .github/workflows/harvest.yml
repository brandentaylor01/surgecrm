name: Rainmaker 24/7 Autonomous Core

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository code
        uses: actions/checkout@v4

      - name: Configure Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Setup Headless Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install extraction dependencies
        run: |
          pip install pandas requests supabase selenium

      - name: Execute extraction loop
        run: |
          python3 autonomous_harvester.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
