name: Rainmaker 24/7 Autonomous Core

on:
  schedule:
    # Triggers the cloud harvester to wake up every hour on the dot
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to manually trigger it with a button click on GitHub

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository code
        uses: actions/checkout@v4

      - name: Configure Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install extraction dependencies
        run: |
          pip install pandas requests supabase

      - name: Execute extraction loop
        run: |
          python3 autonomous_harvester.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
